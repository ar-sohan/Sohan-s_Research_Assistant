[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
description = "A hand-built research paper assistant agent: arXiv search, verified citations, memory and evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["gradio>=5.0"]   # pip install -e ".[web]"  -> python app.py

# This line is what creates the `paper-agent` command after `pip install -e .`
[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
